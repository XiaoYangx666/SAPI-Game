name: Verify

on:
  push:
    branches:
      - master
      - feat/ddz-support
      - experiment/runtime-host
      - work/test-engine-v1
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm run test:unit
