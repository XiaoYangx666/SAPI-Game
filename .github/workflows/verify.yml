name: Verify

on:
  push:
    branches:
      - master
      - feat/ddz-support
      - next
  pull_request:
    branches:
      - master
      - next

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm run test:unit
      - run: npm pack --dry-run --workspace @begame/core
      - run: npm pack --dry-run --workspace @begame/test
      - run: npm pack --dry-run --workspace @begame/trace-tools
